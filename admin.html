<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Admin — DAZPRO Signage Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin">
  <header class="topbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/logo.png" alt="Dazpro Advertising" width="720" height="273" />
      <span class="brand-tag">Admin</span>
    </a>
    <nav class="topnav">
      <span class="muted small" id="who"></span>
      <button class="btn btn-sm btn-ghost" id="notif" hidden title="Beri tahu saya saat ada pengajuan baru">Aktifkan notifikasi</button>
      <a class="btn btn-sm btn-ghost" href="index.html">Buka studio</a>
      <button class="btn btn-sm btn-ghost" id="logout" hidden>Keluar</button>
    </nav>
  </header>

  <main class="adm">
    <section class="login" id="login" hidden>
      <img class="login-logo" src="assets/logo.png" alt="Dazpro Advertising" />
      <h1>Admin pengajuan</h1>
      <p class="muted">Masuk dengan akun Google yang terdaftar sebagai admin untuk melihat pengajuan desain.</p>
      <button class="btn btn-primary btn-block" id="btn-login">Masuk dengan Google</button>
      <p class="note" id="inapp" hidden>Anda membuka halaman ini dari aplikasi (WhatsApp/Instagram/dll). Google tidak mengizinkan login di sini — buka lewat <b>Chrome</b> atau <b>Safari</b>.</p>
      <div class="login-err" id="login-msg" hidden></div>
    </section>

    <section id="board" hidden>
      <div class="adm-tabs" id="adm-tabs">
        <button class="active" data-view="subs">Pengajuan</button>
        <button data-view="price">Pengaturan harga</button>
        <button data-view="gallery">Galeri</button>
      </div>
      <div id="view-subs">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <div class="seg-ctl" id="filters"></div>
        <input class="input" id="search" placeholder="Cari nama, usaha, kota, nomor…" />
        <button class="btn btn-ghost btn-sm" id="export">Export CSV</button>
      </div>
      <div class="list" id="list"></div>
      <p class="muted small" id="empty" hidden>Belum ada pengajuan.</p>
      </div>
      <div id="view-price" hidden></div>
      <div id="view-gallery" hidden></div>
    </section>
    <p class="muted" id="state-msg">Memuat…</p>
  </main>

  <div class="drawer" id="detail" hidden>
    <div class="drawer-card wide">
      <div class="drawer-head"><h3 id="d-title">Detail</h3><button class="icon-btn" data-close aria-label="Tutup">✕</button></div>
      <div id="d-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
